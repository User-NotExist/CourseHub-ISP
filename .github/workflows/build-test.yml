name: Test Docker Compose Build

on:
  pull_request:
    branches: [ main, master ]

jobs:
  compose-build-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./source

    steps:
      # 1. Check out the repository source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx (recommended for advanced caching and multi-platform builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      # 3. Create fake environment file for build to pass.
      - name: Create Fake .env
        run: touch ./coursehub/.env

      # 3. Test building all services defined in docker-compose.yml
      - name: Build Docker Compose Services
        run: docker compose build --parallel

      # 4. Always tear down containers to free resources, even if prior steps fail
      - name: Cleanup / Tear Down
        if: always()
        run: docker compose down --volumes --remove-orphans
