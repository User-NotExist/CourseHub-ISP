services:
  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: coursehub-backend
    # No published port: only the frontend reaches the backend, over coursehub-net
    # (login is relayed through the frontend's /auth/login and /auth/callback).
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - coursehub-net

  frontend:
    build:
      context: ./coursehub
      dockerfile: Dockerfile
      args:
        NODE_VERSION: 24.14.0
    container_name: coursehub-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - coursehub-net

networks:
  coursehub-net:
    driver: bridge
